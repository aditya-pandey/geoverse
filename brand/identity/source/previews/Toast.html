<!-- @dsCard group="Feedback" height=250 subtitle="Short messages that arrive and leave on their own" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div class="bh-stack">
  <div class="bh-toast" role="status"><span class="bh-toast__icon" data-bh-icon="globe" data-bh-size="20"></span>Your device paused the globe. Bringing it back…</div>
  <div class="bh-toast bh-toast--success" role="status"><span class="bh-toast__icon" data-bh-icon="star" data-bh-size="20"></span>Shabash! That's Bolivia.</div>
  <div class="bh-toast bh-toast--danger" role="alert"><span class="bh-toast__icon" aria-hidden="true">✕</span>This device can't draw the 3D globe. The 2D map still works.</div>
  <div class="bh-toast bh-toast--reward" role="status"><span class="bh-toast__icon" data-bh-kancha="mint" data-bh-size="32"></span>New marble: South America, all 12 countries</div>
</div>
<script>Bhoogol.hydrate();</script>
</body>
</html>
