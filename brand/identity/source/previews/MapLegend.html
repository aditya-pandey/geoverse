<!-- @dsCard group="Globe" height=200 subtitle="Legends for data maps" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Map legend</title></head>
<body>
<div class="bh-stage" style="align-items: flex-start;">
  <figure class="bh-legend" style="margin: 0;">
    <figcaption class="bh-legend__title">People per km²</figcaption>
    <div class="bh-legend__ramp" aria-hidden="true">
      <span style="background: var(--seq-1)"></span><span style="background: var(--seq-2)"></span><span style="background: var(--seq-3)"></span><span style="background: var(--seq-4)"></span><span style="background: var(--seq-5)"></span>
    </div>
    <div class="bh-legend__ticks"><span>0</span><span>25</span><span>100</span><span>300</span><span>1,000+</span></div>
  </figure>
  <figure class="bh-legend" style="margin: 0;">
    <figcaption class="bh-legend__title">Population change, 2014–2024</figcaption>
    <div class="bh-legend__ramp" aria-hidden="true">
      <span style="background: var(--div-neg-2)"></span><span style="background: var(--div-neg-1)"></span><span style="background: var(--div-mid)"></span><span style="background: var(--div-pos-1)"></span><span style="background: var(--div-pos-2)"></span>
    </div>
    <div class="bh-legend__ticks"><span>−10%</span><span>−2%</span><span>0</span><span>+2%</span><span>+10%</span></div>
  </figure>
</div>
</body>
</html>
