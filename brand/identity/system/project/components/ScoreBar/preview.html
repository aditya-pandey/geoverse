<!-- @dsCard group="Games" height=110 subtitle="Score, streak and the marbles you've collected" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Score bar</title></head>
<body>
<div class="bh-stage">
  <div class="bh-score" role="status" aria-label="Score 840, 5 in a row, 3 of 5 marbles">
    <span class="bh-score__pts"><span data-bh-icon="star" data-bh-size="20"></span>840</span>
    <span class="bh-score__streak">5 in a row</span>
    <span class="bh-score__marbles">
      <span data-bh-kancha="blue" data-bh-size="22"></span>
      <span data-bh-kancha="mint" data-bh-size="22"></span>
      <span data-bh-kancha="marigold" data-bh-size="22"></span>
      <span class="is-empty" data-bh-kancha="mint" data-bh-size="22"></span>
      <span class="is-empty" data-bh-kancha="blue" data-bh-size="22"></span>
    </span>
  </div>
</div>
<script>Bhoogol.hydrate();</script>
</body>
</html>
