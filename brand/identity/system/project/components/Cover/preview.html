<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bhoogol</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-display); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .ocean { fill: var(--ocean); }
  .mint { fill: var(--mint); }
  .marigold { fill: var(--marigold); }
  .inverse { fill: var(--ink); }
  .ground { fill: var(--ground); }
  .blk-l { rx: var(--radius-l); }
  .blk-m { rx: var(--radius-m); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: .92; font-weight: 800; letter-spacing: -.01em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font: 500 14px/20px var(--font-text); color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ocean 208×336 (bleeds top and bottom, radius-l) · mint 112×128 (bleeds top, radius-l) ·
              marigold 112×144 (radius-l) · ink 128×336 (bleeds right and bottom, radius-l) — the logo's sea, two lands, and the inverse ground
  arrangement one tall ocean slab with satellites, stepped like the letters of bhoogol; blocks right of x=480 only
  pattern     discs (literal motif: worlds, marbles) — the "oo" as two ground-cut discs on the ocean slab, plus a scatter of
              small discs (radius-pill dots) like stars; chosen because the brand is round things on a deep ground
  scales      space-4 16 gaps, space-5 24 inset, discs r48 (space-7 ÷ 2 × 2) and r6/r4 dots, radius-l 24 corners
-->
  <rect class="ocean blk-l" x="16" y="-24" width="208" height="336"/>
  <rect class="mint blk-l" x="240" y="-24" width="112" height="128"/>
  <rect class="marigold blk-l" x="240" y="120" width="112" height="144"/>
  <rect class="inverse blk-l" x="368" y="-24" width="128" height="336"/>
  <circle class="mint" cx="72" cy="150" r="48"/>
  <circle class="marigold" cx="172" cy="150" r="48"/>
  <circle class="ground" cx="64" cy="140" r="12"/>
  <circle class="ground" cx="186" cy="160" r="10"/>
  <circle class="ocean" cx="424" cy="64" r="6"/>
  <circle class="marigold" cx="440" cy="200" r="8"/>
  <circle class="ocean" cx="400" cy="244" r="4"/>
  <circle class="mint" cx="296" cy="40" r="6"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Bhoogol</h1>
  <p class="tag">भूगोल · the round Earth, made to spin, tap and remember.</p>
</div>
</div>
</body>
</html>
