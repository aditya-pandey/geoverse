<!-- @dsCard group="Actions" height=120 subtitle="Toy-key buttons that press down onto a ledge" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="bh-stage">
  <button class="bh-btn bh-btn--primary" type="button">Fly there</button>
  <button class="bh-btn bh-btn--blue" type="button"><span data-bh-icon="compare" data-bh-size="22"></span>Compare</button>
  <button class="bh-btn" type="button"><span data-bh-icon="share" data-bh-size="22"></span>Share</button>
  <button class="bh-btn bh-btn--quiet" type="button">Skip</button>
  <button class="bh-btn bh-btn--icon" type="button" aria-label="Sound on"><span data-bh-icon="sound"></span></button>
  <button class="bh-btn bh-btn--primary bh-btn--small" type="button">Play again</button>
</div>
<script>Bhoogol.hydrate();</script>
</body>
</html>
