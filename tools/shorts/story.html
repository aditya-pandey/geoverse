<!doctype html>
<html><head><meta charset="utf-8">
<title>Bhoogol story</title>
<!-- A narrated map story in the style of the history Shorts: a satellite map that dives from a continent down to a
     single place (real aerial photos when assets/places/<slug>/ has them), countries flooded with colour, little
     characters on the map, big years and stamps. Driven frame by frame with seek(t); line and word timings come
     from narrate.py or voice.py, so the picture follows the voice. Scenes are named in the story JSON. -->
<style>

@font-face{font-family:'Baloo 2';font-weight:700;src:url(node_modules/@fontsource/baloo-2/files/baloo-2-latin-700-normal.woff2)}
@font-face{font-family:'Mukta';font-weight:600;src:url(node_modules/@fontsource/mukta/files/mukta-latin-600-normal.woff2)}
@font-face{font-family:'Kalam';font-weight:700;src:url(node_modules/@fontsource/kalam/files/kalam-latin-700-normal.woff2)}
@font-face{font-family:'Kalam';font-weight:700;src:url(node_modules/@fontsource/kalam/files/kalam-latin-ext-700-normal.woff2);unicode-range:U+0100-024F}
:root{--space:#12133A;--gold:#FFB020;--mint:#3DDC97;--chalk:#F7F5EF;--ink:#12133A}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse 85% 60% at 50% 45%,#1b1d4d 0%,#12133A 60%,#0b0c26 100%)}

.abs{position:absolute}
.w{display:inline-block}
.cap{position:absolute;left:0;width:1080px;top:1600px;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:76px;line-height:1.05;color:#fff;
  paint-order:stroke fill;-webkit-text-stroke:12px #12133A;text-shadow:0 8px 0 rgba(18,19,58,.55)}
.cap .on{color:var(--gold)}

  paint-order:stroke fill;-webkit-text-stroke:11px #12133A;text-shadow:0 9px 0 rgba(18,19,58,.5)}

  paint-order:stroke fill;-webkit-text-stroke:18px #12133A;text-shadow:0 14px 0 rgba(18,19,58,.55);transform-origin:50% 55%}

  padding:22px 34px 10px;background:rgba(255,255,255,.88);transform-origin:50% 50%;box-shadow:0 18px 40px rgba(0,0,0,.35)}

  font-family:'Kalam';font-weight:700;color:#4A3413;text-align:center;overflow:hidden}

<body>
<div id="stage">

</div>
<script src="node_modules/d3-array/dist/d3-array.min.js"></script>

<script>
const $ = (s) => document.querySelector(s), W = 1080, H = 1920, PI = Math.PI, RAD = PI / 180, R = 6378137;
/* ---------- motion helpers (brand: settle, pop) ---------- */
function bez(x1, y1, x2, y2) { const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, t = x; for (let i = 0; i < 40; i++) { X(t) < x ? lo = t : hi = t; t = (lo + hi) / 2; } return Y(t); }; }
const E = { settle: bez(.2, .9, .25, 1), pop: bez(.34, 1.56, .64, 1), inout: bez(.65, 0, .35, 1), in: bez(.55, 0, .9, .3), out: bez(.16, 1, .3, 1), dive: bez(.45, 0, .2, 1) };

  s.transform = `translate(${o.x || 0}px,${o.y || 0}px) rotate(${o.r || 0}deg) scale(${o.s ?? 1})${o.sx != null ? ` scaleX(${o.sx})` : ''}`; s.filter = o.blur > .05 ? `blur(${o.blur}px)` : 'none'; }

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SFX = []; const sfx = (t, name, gain = 1) => SFX.push({ t: +Math.max(0, t).toFixed(3), name, gain });
const mercY = (lat) => R * Math.log(Math.tan(PI / 4 + lat * RAD / 2)), mercX = (lon) => R * lon * RAD;
const unY = (y) => Math.atan(Math.sinh(y / R)) / RAD;
const smooth = (w, from, to) => clamp(Math.log(from / w) / Math.log(from / to));     /* 0 when zoomed out to `from` km, 1 at `to` km */
const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
/* a point `m` metres from ll on a compass bearing */
function offset(ll, bearing, m) { const b = bearing * RAD, dn = Math.cos(b) * m, de = Math.sin(b) * m;
  return [ll[0] + de / (111320 * Math.cos(ll[1] * RAD)), ll[1] + dn / 110540]; }

/* ---------- data ---------- */
let SPEC, TIM, PLACE, MAN = { layers: [] }, LAYERS = {}, OUTLINE, COUNTRIES = {}, BM, FLAG = {}, CHAR = {};
async function loadData() {
  const slug = SPEC.place.slug, base = `assets/places/${slug}/`;
  const [t, man, outl] = await Promise.all([
    fetch('node_modules/world-atlas/countries-50m.json').then((r) => r.json()),
    fetch(base + 'manifest.json').then((r) => (r.ok ? r.json() : null)).catch(() => null),
    fetch(base + 'outline.geojson').then((r) => (r.ok ? r.json() : null)).catch(() => null)]);
  const raw = await fetch('node_modules/world-countries/countries.json').then((r) => r.json());
  const byN = new Map(raw.map((c) => [c.ccn3, c.cca3]));
  for (const f of topojson.feature(t, t.objects.countries).features) { const c = byN.get(String(f.id).padStart(3, '0')); if (c === 'FRA' || c === 'ESP') COUNTRIES[c] = f; }
  /* mainland only: drop overseas pieces far from Europe */
  for (const c of ['FRA', 'ESP']) { const g = COUNTRIES[c].geometry;
    if (g.type === 'MultiPolygon') g.coordinates = g.coordinates.filter((p) => { const ce = d3.geoCentroid({ type: 'Polygon', coordinates: p }); return ce[0] > -12 && ce[0] < 12 && ce[1] > 35 && ce[1] < 52; }); }
  if (man) MAN = man;
  PLACE = { center: MAN.center || [SPEC.place.lon, SPEC.place.lat] };
  for (const L of MAN.layers || []) { const img = await loadImg(base + L.file); if (img) LAYERS[L.name] = { ...L, img: feather(img, L.name === 'wide' || L.name === 'regional' ? .16 : .1) }; }

  if (d3.geoArea(OUTLINE) > 2 * PI) OUTLINE = { type: 'Polygon', coordinates: OUTLINE.coordinates.map((r) => [...r].reverse()) };   /* OSM winds rings the other way round */
  /* the island's long axis, for laying out flags, rulers and pitches */
  const ring = OUTLINE.coordinates[0], c = PLACE.center, k = Math.cos(c[1] * RAD);
  const pts = ring.map((p) => [(p[0] - c[0]) * 111320 * k, (p[1] - c[1]) * 110540]);
  let sxx = 0, syy = 0, sxy = 0; for (const [x, y] of pts) { sxx += x * x; syy += y * y; sxy += x * y; }

  PLACE.mid = Math.min(...proj) + PLACE.half;

    c.width = 640; c.height = 480; c.getContext('2d').drawImage(im, 0, 0, 640, 480); FLAG[f] = c; }   /* bitmap, so the waving slices sample correctly */
  for (const n of ['soldier_es', 'soldier_fr', 'diplomat_es', 'diplomat_fr', 'viceroy_es', 'viceroy_fr'])
    CHAR[n] = (await loadImg(`assets/chars/${n}.png`))?.src || 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(chibi(n));

  for (let i = 0; i <= 40; i++) { const a = i / 40 * 2 * PI, x = Math.cos(a) * L / 2, y = Math.sin(a) * L * .1;

  x.fillStyle = gx; x.fillRect(0, 0, c.width, c.height);

/* ---------- the satellite globe for the outro (WebGL, NASA Blue Marble) ---------- */
const gl = $('#earth').getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false });

function initGL(img) {

  const float PI = 3.14159265;
  void main(){

    float rho = length(q);

    float lon = lon0 + atan(q.x * sin(c), rho * cos(c) * cos(lat0) - q.y * sin(c) * sin(lat0));

    col *= mix(0.42, 1.12, lit);
    col = mix(col, vec3(0.55, 0.72, 1.0), pow(rho, 8.0) * 0.55);
    gl_FragColor = vec4(col, edge * alpha);
  }`;

    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  PROG = gl.createProgram(); gl.attachShader(PROG, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(PROG, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(PROG); gl.useProgram(PROG);
