<!doctype html>
<html><head><meta charset="utf-8">
<title>Bhoogol countdown</title>
<style>

html,body{margin:0;background:#000;overflow:hidden}

canvas{position:absolute;left:0;top:0}
.abs{position:absolute}
.w{display:inline-block}

.cap{position:absolute;left:0;width:1080px;top:1352px;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:76px;line-height:1.05;color:#fff;
  paint-order:stroke fill;-webkit-text-stroke:12px #12133A;text-shadow:0 8px 0 rgba(18,19,58,.55)}
.cap .on{color:var(--gold)}

.badge img{width:136px;height:136px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.badge .n{position:absolute;inset:0;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:88px;line-height:150px;color:#fff;paint-order:stroke fill;-webkit-text-stroke:10px #12133A}

.mini .q{position:absolute;inset:0;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:96px;line-height:140px;color:var(--gold)}
.title{position:absolute;left:60px;width:960px;text-align:center;font-family:'Baloo 2';font-weight:800;color:#fff;line-height:1.02;
  paint-order:stroke fill;-webkit-text-stroke:10px #12133A;text-shadow:0 8px 0 rgba(18,19,58,.5)}
.pill{display:inline-block;font-family:'Baloo 2';font-weight:700;font-size:50px;color:#1a1300;background:var(--gold);border-radius:999px;padding:16px 52px 12px;box-shadow:0 7px 0 #C47F00}
</style></head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="earth" width="1080" height="1920"></canvas>
  <canvas id="over" width="1080" height="1920"></canvas>
  <div id="paper"><canvas id="paperBg" width="1200" height="2040"></canvas><div id="paperIn"></div></div>
  <div id="ui"></div>
</div>
<script src="node_modules/d3-array/dist/d3-array.min.js"></script>
<script src="node_modules/d3-geo/dist/d3-geo.min.js"></script>
<script src="node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script>
const $ = (s) => document.querySelector(s), W = 1080, H = 1920, NS = 'http://www.w3.org/2000/svg';
/* ---------- motion helpers (brand: settle, pop) ---------- */

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const flagSrc = (c) => `node_modules/flag-icons/flags/4x3/${c}.svg`;
const SFX = []; const sfx = (t, name, gain = 1) => SFX.push({ t: +Math.max(0, t).toFixed(3), name, gain });

/* ---------- data ---------- */
let SPEC, TIM, WORLD = {}, MARK = '';
async function loadData() {
  const [t10, raw, circle] = await Promise.all([
    fetch('node_modules/world-atlas/countries-10m.json').then((r) => r.json()),
    fetch('node_modules/world-countries/countries.json').then((r) => r.json()),
    fetch('../../brand/identity/dist/marks/marker-circle.svg').then((r) => r.text())]);

/* ---------- the satellite globe (WebGL, NASA Blue Marble) ---------- */

    vec3 col = texture2D(tex, uv).rgb;
    col = pow(col, vec3(0.92)) * 1.06;                                  /* a touch richer */
    vec3 n = vec3(q.x, q.y, sqrt(max(0.0, 1.0 - rho * rho)));
    float lit = clamp(dot(n, normalize(vec3(-0.45, 0.5, 0.75))), 0.0, 1.0);
    col *= mix(0.42, 1.12, lit);                                         /* light from the upper left, as in the brand */
    col = mix(col, vec3(0.55, 0.72, 1.0), pow(rho, 8.0) * 0.55);         /* atmosphere at the rim */
    gl_FragColor = vec4(col, edge * alpha);

const octx = $('#over').getContext('2d');

    octx.beginPath(); octx.arc(p[0], p[1], 18 + 60 * pulse, 0, 6.2832); octx.stroke();
    octx.fillStyle = `rgba(255,176,32,${hl.a})`; octx.strokeStyle = `rgba(247,245,239,${hl.a})`; octx.lineWidth = 5;
    octx.beginPath(); octx.arc(p[0], p[1], 15, 0, 6.2832); octx.fill(); octx.stroke();

/* ---------- stars ---------- */
const bctx = $('#bg').getContext('2d'); let STARS = [];
function stars(t, zoom) { bctx.clearRect(0, 0, W, H);
  for (const s of STARS) { const z = 1 + (zoom - 1) * s.z, x = 540 + (s.x - 540) * z, y = 960 + (((s.y + t * 6 * s.z) % 2000) - 960) * z, tw = .55 + .45 * Math.sin(t * 1.7 + s.ph);
    bctx.globalAlpha = .12 + .55 * s.z * tw; bctx.fillStyle = '#F7F5EF'; bctx.beginPath(); bctx.arc(x, y, (.7 + 1.6 * s.sz * s.z) * Math.sqrt(z), 0, 6.283); bctx.fill(); }
  bctx.globalAlpha = 1; }

/* ---------- the exercise-book page ---------- */
function paperTexture() {
  const c = $('#paperBg'), x = c.getContext('2d'), w = c.width, hh = c.height;
  x.fillStyle = '#F7F5EF'; x.fillRect(0, 0, w, hh);
  let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26000; i++) { x.fillStyle = `rgba(${R() < .5 ? '120,100,60' : '255,255,255'},${.03 + R() * .05})`; x.fillRect(R() * w, R() * hh, 1 + R() * 2.5, 1 + R() * 2.5); }
  for (let i = 0; i < 260; i++) { x.strokeStyle = `rgba(150,130,90,${.05 + R() * .06})`; x.lineWidth = .8; x.beginPath(); const a = R() * w, b = R() * hh; x.moveTo(a, b); x.quadraticCurveTo(a + R() * 40 - 20, b + R() * 40 - 20, a + R() * 70 - 35, b + R() * 70 - 35); x.stroke(); }
  x.strokeStyle = 'rgba(46,107,255,.16)'; x.lineWidth = 2;                    /* the squared lines of a geography notebook */
  for (let y = 40; y < hh; y += 56) { x.beginPath(); x.moveTo(0, y); x.lineTo(w, y); x.stroke(); }
  for (let X = 30; X < w; X += 56) { x.beginPath(); x.moveTo(X, 0); x.lineTo(X, hh); x.stroke(); }
  x.strokeStyle = 'rgba(220,60,60,.45)'; x.lineWidth = 3; x.beginPath(); x.moveTo(170, 0); x.lineTo(170, hh); x.stroke();
  const v = x.createRadialGradient(w / 2, hh / 2, hh * .3, w / 2, hh / 2, hh * .72); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(90,70,30,.22)'); x.fillStyle = v; x.fillRect(0, 0, w, hh);
}
function markEl(w, ht) {
  const wrap = h(`<div class="abs" style="width:${w}px;height:${ht}px"></div>`);
  wrap.innerHTML = MARK.replace('<svg ', `<svg preserveAspectRatio="none" width="${w}" height="${ht}" `);
  const svg = wrap.firstChild, id = 'm' + Math.random().toString(36).slice(2);
  const defs = document.createElementNS(NS, 'defs'), mask = document.createElementNS(NS, 'mask'); mask.setAttribute('id', id); mask.setAttribute('maskUnits', 'userSpaceOnUse');
  ['x', 'y'].forEach((k) => mask.setAttribute(k, -60)); ['width', 'height'].forEach((k) => mask.setAttribute(k, 380));
  const rev = document.createElementNS(NS, 'path'); rev.setAttribute('fill', '#fff'); mask.appendChild(rev); defs.appendChild(mask); svg.prepend(defs);
  const g = document.createElementNS(NS, 'g'); g.setAttribute('mask', `url(#${id})`); [...svg.querySelectorAll(':scope > path')].forEach((p) => g.appendChild(p)); svg.appendChild(g);

    rev.setAttribute('d', p >= .999 ? `M-132 128a260 260 0 1 0 520 0a260 260 0 1 0 -520 0Z` : p <= 0 ? 'M0 0Z' :

/* write-on for handwriting: reveal left to right */
function writeOn(el, p) { el.style.clipPath = `inset(-20% ${100 - 100 * clamp(p)}% -30% -5%)`; }
/* draw a country to scale in an SVG (km → px via an equal-area projection centred on it) */
function shapeSVG(features, { pxPerKm, fill, stroke, width = 4 }) {

  const c = d3.geoCentroid(fc), p = d3.geoAzimuthalEqualArea().rotate([-c[0], -c[1]]).scale(6371 * pxPerKm).translate([0, 0]);
  const path = d3.geoPath(p), b = path.bounds(fc);
  const pad = 10, wv = b[1][0] - b[0][0] + 2 * pad, hv = b[1][1] - b[0][1] + 2 * pad;
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('width', wv); svg.setAttribute('height', hv);
  svg.setAttribute('viewBox', `${b[0][0] - pad} ${b[0][1] - pad} ${wv} ${hv}`); svg.style.overflow = 'visible';
  for (const f of features) { const e = document.createElementNS(NS, 'path'); e.setAttribute('d', path(f)); e.setAttribute('fill', fill); e.setAttribute('stroke', stroke);

/* ---------- build ---------- */
const UI = $('#ui'), PIN = $('#paperIn');
let LINES, ITEMS, DUR, CAM = [], CARDS = {}, CAPS = [];
function line(i) { return LINES[i]; }
function buildTimeline() {
  LINES = TIM.lines; ITEMS = SPEC.items;
  const L = (pred) => LINES.filter(pred);
  const hook = L((l) => l.scene === 'hook')[0], lineup = L((l) => l.scene === 'lineup')[0], outro = L((l) => l.scene === 'outro')[0];

    const tgt = [it.lng, it.lat];

      K.push([flies[0].t0, prev[1], prev[2], prev[3], 990]);
      K.push([flies[1].t0 - .05, 12, 42, 560, 990]);                         /* pull back… */

    const cs = L((l) => l.scene === 'card' && l.rank === it.rank); if (!cs.length) continue;
    const next = LINES.find((l) => l.t0 > cs[cs.length - 1].t0 && l.scene !== 'card');
    CARDS[it.rank] = { a: cs[0].t0 - .15, b: next ? next.t0 - .05 : DUR, steps: cs.map((c) => c.t0) };
  }

  for (const l of LINES) { let cur = [];
    l.words.forEach((w, i) => { cur.push(w); if (cur.length === 3 || /[,.;:?!]$/.test(w.w) || i === l.words.length - 1) { CAPS.push(cur); cur = []; } }); }

  sfx(.05, 'whoosh', .5);

    sfx(flies[0].t0 - .1, 'whoosh', .7); sfx(flies[0].t0 + .1, 'pop', .8);

}
function camAt(t) {
  let i = 0; while (i < CAM.length - 1 && t >= CAM[i + 1][0]) i++;
  const a = CAM[i], b = CAM[Math.min(i + 1, CAM.length - 1)];
  const f = b === a ? 1 : E.inout(prog(t, a[0], b[0]));
  const ll = d3.geoInterpolate([a[1], a[2]], [b[1], b[2]])(f), dist = d3.geoDistance([a[1], a[2]], [b[1], b[2]]);

/* ---------- per-frame ---------- */
const RANKS = () => [...ITEMS].sort((a, b) => b.rank - a.rank);
function seek(t) {
  const hook = LINES.find((l) => l.scene === 'hook'), lineup = LINES.find((l) => l.scene === 'lineup'), outro = LINES.find((l) => l.scene === 'outro');
  /* which item is current (by its first fly line) */
  let cur = null; for (const it of RANKS()) { const f = LINES.find((l) => l.scene === 'fly' && l.rank === it.rank); if (t >= f.t0 - .1) cur = it; }
  /* camera + globe */
  const C = camAt(t);
  const zoomStars = 1 + .5 * prog(t, 0, hook.t1);
  stars(t, zoomStars);
  C.alpha = (1 - .55 * E.inout(prog(t, outro.t0 + .2, outro.t0 + 1.0))) * (1 - .45 * (t >= lineup.t0 - .2 && t < lineup.t1 + .2 ? E.inout(prog(t, lineup.t0 - .2, lineup.t0 + .3)) * (1 - E.inout(prog(t, lineup.t1 - .2, lineup.t1 + .2))) : 0));
  C.hi = [];
  /* tease: a '?' pin over Rome at the end of the hook */
  const vat = ITEMS.find((i) => i.rank === 1);
  if (t > hook.t0 + 2.2 && t < lineup.t1) C.hi.push({ cca3: '__', lng: vat.lng, lat: vat.lat, a: prog(t, hook.t0 + 2.2, hook.t0 + 2.6) * (1 - prog(t, lineup.t1 - .3, lineup.t1)), t, label: '?', la: prog(t, hook.t0 + 2.4, hook.t0 + 2.9) });
  if (cur) { const f = LINES.find((l) => l.scene === 'fly' && l.rank === cur.rank), rev = LINES.find((l) => l.scene === 'fly' && l.rank === cur.rank && l.reveal);
    const arrive = rev ? rev.t0 + .6 : f.t0 + 1.3;
    C.hi.push({ cca3: cur.cca3, lng: cur.lng, lat: cur.lat, a: prog(t, arrive - .2, arrive + .3), t, label: cur.name, la: prog(t, arrive, arrive + .5) }); }
  if (t >= outro.t0) C.hi = [];

  /* hook eyebrow */
  const hp = E.pop(prog(t, .05, .5)), ho = E.in(prog(t, lineup.t0 - .1, lineup.t0 + .2));
  css(hookEls.eb, { op: clamp(hp * 2) * (1 - ho), s: .8 + .2 * hp, y: -ho * 40, blur: ho * 10 });
  /* lineup */
  const lu = E.settle(prog(t, lineup.t0, lineup.t0 + .5)), lo = E.in(prog(t, lineup.t1 - .1, lineup.t1 + .25));
  css(lineupEls.title, { op: lu * (1 - lo), y: (1 - lu) * 40 - lo * 30, s: .96 + .04 * lu, blur: (1 - lu) * 10 });
  lineupEls.cards.forEach((c, i) => { const a = lineup.t0 + .2 + i * .3, p = E.pop(prog(t, a, a + .45));
    css(c, { op: clamp(p * 3) * (1 - lo), y: (1 - p) * -220 + lo * 120, r: (1 - p) * (i % 2 ? 14 : -14) + (i - 2) * 2.5, s: .85 + .15 * p }); });
  /* countdown badge */
  if (cur && t < outro.t0) { const f = LINES.find((l) => l.scene === 'fly' && l.rank === cur.rank), p = E.pop(prog(t, f.t0, f.t0 + .45));
    badge.querySelector('.n').textContent = cur.rank; css(badge, { op: clamp(p * 2) * (1 - prog(t, outro.t0 - .3, outro.t0)), s: .5 + .5 * p, r: (1 - p) * -40 }); }
  else css(badge, { op: 0 });

  let onCard = null; for (const it of ITEMS) { const c = CARDS[it.rank]; if (c && t >= c.a - .02 && t < c.b + .4) onCard = it; }
  const paper = $('#paper');
  if (onCard) {
    const c = CARDS[onCard.rank], inn = E.inout(prog(t, c.a, c.a + .38)), out = E.in(prog(t, c.b, c.b + .35));

    paper.style.transform = `translateX(${(1 - inn) * 1150 - out * 1150}px) rotate(${(1 - inn) * 6 - out * 6}deg)`;
    paper.style.filter = (inn < 1 || out > 0) ? `blur(${(Math.sin(Math.PI * inn) + Math.sin(Math.PI * out)) * 6}px)` : 'none';
    for (const it of ITEMS) if (CARDS[it.rank]?.dom) CARDS[it.rank].dom.root.style.display = it === onCard ? 'block' : 'none';
    seekCard(onCard, t - c.a, c);

  let chunk = null; for (const ch of CAPS) if (t >= ch[0].t0 - .02 && t < ch[ch.length - 1].t1 + .25) chunk = ch;
  if (chunk) { const p = E.pop(prog(t, chunk[0].t0 - .02, chunk[0].t0 + .18));
    capEl.innerHTML = chunk.map((w) => `<span class="w${t >= w.t0 - .02 && t < w.t1 + .1 ? ' on' : ''}">${esc(w.w)}</span>`).join(' ');
    css(capEl, { op: 1, s: .88 + .12 * p }); capEl.style.top = (onCard ? 1452 : 1352) + 'px'; }
  else css(capEl, { op: 0 });

  const ou = t - outro.t0;
  css(outroEls.wm, { op: E.settle(prog(ou, .5, 1.1)), y: (1 - E.settle(prog(ou, .5, 1.1))) * 50 });
  const pp = E.pop(prog(ou, .9, 1.3)); css(outroEls.pill, { op: clamp(pp * 2), s: .7 + .3 * pp });
  css(outroEls.sub, { op: E.settle(prog(ou, 1.2, 1.7)), y: (1 - E.settle(prog(ou, 1.2, 1.7))) * 20 });
}
function seekCard(it, tau, c) {
  if (!c.dom) c.dom = buildCard(it);
  const d = c.dom, P = d.fig.parts, s1 = c.steps[1] != null ? c.steps[1] - c.a : 99;
  /* the page drifts like a hand-held camera */
  PIN.style.transform = `scale(${1.02 + tau * .006}) rotate(${-1.2 + Math.sin(tau * .5) * .8}deg) translateY(${Math.sin(tau * .7) * 6}px)`;
  writeOn(d.nick, prog(tau, .35, 1.0));
  const fl = E.settle(prog(tau, .25, .85));
  d.flag.style.transform = `perspective(1400px) translateY(${(1 - fl) * -700}px) rotateX(${10 + (1 - fl) * 30}deg) rotateY(${Math.sin(tau * .9) * 11}deg) rotateZ(${-4 + (1 - fl) * -18 + Math.sin(tau * .6) * 2}deg) scale(${.96 + .04 * Math.sin(tau * .4)})`;
  d.flag.style.opacity = clamp(fl * 3);
  writeOn(d.area, prog(tau, .7, 1.25)); d.under.draw(E.settle(prog(tau, 1.2, 1.6)));
  const fig = E.settle(prog(tau, .9, 1.4)); css(d.fig.el, { op: fig, y: (1 - fig) * 30 });
  if (it.visual === 'enclave') { writeOn(P.it, prog(tau, 1.2, 1.6)); P.m.draw(E.settle(prog(tau, 1.6, 2.0))); writeOn(P.sm, prog(tau, 1.8, 2.5));
    writeOn(P.ext, prog(tau, s1 + 5.6, s1 + 6.4)); }
  if (it.visual === 'islands') { P.dots.forEach((dd, i) => { const p = E.pop(prog(tau, 1.2 + i * .12, 1.5 + i * .12)); dd.style.transform = `scale(${p})`; });
    writeOn(P.lbl, prog(tau, 2.4, 3.0)); const sp = E.settle(prog(tau, s1, s1 + .5));
    P.sea.style.opacity = sp; P.sea.style.transform = `translateY(${(1 - sp) * 30}px)`; writeOn(P.ext, prog(tau, s1 + .5, s1 + 1.0)); writeOn(P.person, prog(tau, s1 + 1.2, s1 + 1.7)); }
  if (it.visual === 'island') { const sp = E.pop(prog(tau, 1.0, 1.5)); P.shape.style.transform = `scale(${sp}) rotate(${(1 - sp) * -10}deg)`;
    writeOn(P.lbl, prog(tau, 2.6, 3.2)); writeOn(P.ext, prog(tau, 3.4, 3.9)); P.m.draw(E.settle(prog(tau, 3.8, 4.3))); }
  if (it.visual === 'park') { writeOn(P.pl, prog(tau, 1.1, 1.8)); const bp = E.inout(prog(tau, 2.2, 3.0)); P.bar.style.width = (P.barW * bp) + 'px';
    writeOn(P.sl, prog(tau, 2.8, 3.3)); writeOn(P.pct, prog(tau, 3.1, 3.7));
    const k = Math.floor(P.dots.length * E.out(prog(tau, s1 + .2, s1 + 2.4))); P.dots.forEach((dd, i) => dd.setAttribute('opacity', i < k ? 1 : 0));
    writeOn(P.ext, prog(tau, s1 + 1.4, s1 + 2.1)); }
  if (it.visual === 'parkTile') { writeOn(P.pl, prog(tau, 1.1, 1.8));
    P.blocks.forEach((b, i) => { const a = 2.3 + i * .32, p = E.pop(prog(tau, a, a + .3)); b.style.transform = `scaleY(${p})`; b.style.opacity = clamp(p * 3); writeOn(P.nums[i], prog(tau, a + .05, a + .3)); });
    writeOn(P.sl, prog(tau, 2.6, 3.2)); writeOn(P.ext, prog(tau, 5.0, 5.6)); }
}

/* ---------- entry ---------- */
window.setup = async ({ spec, timing, site }) => {
  SPEC = { ...spec, site }; TIM = timing;
  await loadData();
  for (const it of SPEC.items) { const f = WORLD[it.cca3]; it.lat = f.latlng[0]; it.lng = f.latlng[1]; if (it.cca3 === 'VAT') { it.lat = 41.903; it.lng = 12.453; } }
  const img = new Image(); img.src = 'assets/earth-blue-marble.jpg'; await img.decode(); initGL(img);
  let seed = 11; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  STARS = Array.from({ length: 200 }, () => ({ x: R() * W, y: R() * 2000, z: .2 + R() * .8, ph: R() * 6.28, sz: R() }));
  await Promise.all(["800 92px 'Baloo 2'", "700 50px 'Baloo 2'", "700 60px Kalam", "600 38px Mukta", "500 30px 'JetBrains Mono'"].map((f) => document.fonts.load(f)));
  paperTexture(); buildTimeline(); buildUI();
  for (const it of ITEMS) if (CARDS[it.rank]) CARDS[it.rank].dom = buildCard(it);
  for (const it of ITEMS) if (CARDS[it.rank]) CARDS[it.rank].dom.root.style.display = 'none';
  await Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })));

};
window.seek = seek;
