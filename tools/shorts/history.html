<!doctype html>
<html><head><meta charset="utf-8">
<title>Bhoogol history</title>
<!-- A narrated history story told on a satellite globe: lines drawn across the world, halves flooding with colour,
     ships sailing their real routes, characters, big years. Built first for the Treaty of Tordesillas; scenes are
     named in the story JSON and timed from the narration (narrate.py or voice.py). -->
<style>
@font-face{font-family:'Baloo 2';font-weight:800;src:url(node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2)}
@font-face{font-family:'Baloo 2';font-weight:700;src:url(node_modules/@fontsource/baloo-2/files/baloo-2-latin-700-normal.woff2)}
@font-face{font-family:'Mukta';font-weight:600;src:url(node_modules/@fontsource/mukta/files/mukta-latin-600-normal.woff2)}
@font-face{font-family:'Kalam';font-weight:700;src:url(node_modules/@fontsource/kalam/files/kalam-latin-700-normal.woff2)}
:root{--space:#12133A;--gold:#FFB020;--mint:#3DDC97;--chalk:#F7F5EF;--ink:#12133A}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse 85% 60% at 50% 45%,#1b1d4d 0%,#12133A 60%,#0b0c26 100%)}
canvas{position:absolute;left:0;top:0}
.abs{position:absolute}
.w{display:inline-block}
.cap{position:absolute;left:0;width:1080px;top:1610px;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:76px;line-height:1.05;color:#fff;
  paint-order:stroke fill;-webkit-text-stroke:12px #12133A;text-shadow:0 8px 0 rgba(18,19,58,.55)}
.cap .on{color:var(--gold)}
.title{position:absolute;left:40px;width:1000px;text-align:center;font-family:'Baloo 2';font-weight:800;color:#fff;line-height:1.02;
  paint-order:stroke fill;-webkit-text-stroke:11px #12133A;text-shadow:0 9px 0 rgba(18,19,58,.5)}
.year{position:absolute;left:0;width:1080px;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:230px;line-height:1;color:#fff;
  paint-order:stroke fill;-webkit-text-stroke:18px #12133A;text-shadow:0 14px 0 rgba(18,19,58,.55);transform-origin:50% 55%}
.chip{position:absolute;white-space:nowrap;font-family:'Baloo 2';font-weight:800;font-size:44px;line-height:1;color:var(--ink);background:#fff;border-radius:999px;
  padding:14px 28px 8px;box-shadow:0 6px 0 rgba(18,19,58,.85),0 14px 24px rgba(0,0,0,.3);transform-origin:50% 50%}
.chip.gold{background:var(--gold);box-shadow:0 7px 0 #C47F00,0 14px 24px rgba(0,0,0,.3)}
.chip.green{background:#2FBF71;color:#fff;box-shadow:0 7px 0 #1C7F49,0 14px 24px rgba(0,0,0,.3)}
.hand{position:absolute;font-family:'Kalam';font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 3px 0 rgba(18,19,58,.85),0 0 14px rgba(18,19,58,.6)}
.char{position:absolute;transform-origin:50% 100%;filter:drop-shadow(0 14px 10px rgba(0,0,0,.45))}
.bar{position:absolute;left:120px;height:96px;border-radius:18px;border:6px solid #12133A;box-sizing:border-box;transform-origin:0 50%;box-shadow:0 10px 0 rgba(18,19,58,.5)}
.blab{position:absolute;left:120px;font-family:'Baloo 2';font-weight:800;font-size:46px;color:#fff;paint-order:stroke fill;-webkit-text-stroke:9px #12133A}
.pill{display:inline-block;font-family:'Baloo 2';font-weight:700;font-size:50px;color:#1a1300;background:var(--gold);border-radius:999px;padding:16px 52px 12px;box-shadow:0 7px 0 #C47F00}
</style></head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="earth" width="1080" height="1920"></canvas>
  <canvas id="over" width="1080" height="1920"></canvas>
  <div id="ui"></div>
</div>
<script src="node_modules/d3-array/dist/d3-array.min.js"></script>
<script src="node_modules/d3-geo/dist/d3-geo.min.js"></script>
<script src="node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script>
const $ = (s) => document.querySelector(s), W = 1080, H = 1920, PI = Math.PI, RAD = PI / 180;
function bez(x1, y1, x2, y2) { const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, t = x; for (let i = 0; i < 40; i++) { X(t) < x ? lo = t : hi = t; t = (lo + hi) / 2; } return Y(t); }; }
const E = { settle: bez(.2, .9, .25, 1), pop: bez(.34, 1.56, .64, 1), inout: bez(.65, 0, .35, 1), in: bez(.55, 0, .9, .3), out: bez(.16, 1, .3, 1) };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), prog = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
function css(el, o) { const s = el.style; if ('op' in o) { s.opacity = o.op; s.visibility = o.op <= .001 ? 'hidden' : 'visible'; }
  s.transform = `translate(${o.x || 0}px,${o.y || 0}px) rotate(${o.r || 0}deg) scale(${o.s ?? 1})${o.sx != null ? ` scaleX(${o.sx})` : ''}`; s.filter = o.blur > .05 ? `blur(${o.blur}px)` : 'none'; }
const h = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SFX = []; const sfx = (t, name, gain = 1) => SFX.push({ t: +Math.max(0, t).toFixed(3), name, gain });
const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

/* ---------- characters ---------- */
function chibi(name) {
  const P = {
    pope: { coat: '#F6F3EA', trim: '#D8B04A', hat: 'mitre', prop: 'scroll', cape: '#B3202F' },
    king_es: { coat: '#B3202F', trim: '#F2C230', hat: 'crown', prop: 'sceptre', cape: '#7A1220' },
    king_pt: { coat: '#1F7A45', trim: '#F2C230', hat: 'crown', prop: 'sceptre', cape: '#B3202F' },
  }[name];
  const skin = '#F3C9A2', ink = '#2A1E1A';
  const hats = {
    mitre: `<path d="M104 112 Q110 30 150 14 Q190 30 196 112Z" fill="#FAFAF6" stroke="#C9C3AE" stroke-width="5"/><path d="M150 18 L150 110 M126 62 L174 62" stroke="#D8B04A" stroke-width="9"/>`,
    crown: `<path d="M92 112 L98 52 L124 84 L150 38 L176 84 L202 52 L208 112Z" fill="#FFC531" stroke="#9A6A00" stroke-width="6" stroke-linejoin="round"/><circle cx="150" cy="40" r="9" fill="#E0313D"/><circle cx="98" cy="54" r="7" fill="#3DDC97"/><circle cx="202" cy="54" r="7" fill="#3DDC97"/><rect x="92" y="100" width="116" height="16" rx="5" fill="#FFB020" stroke="#9A6A00" stroke-width="5"/>`,
  };
  const props = {
    scroll: `<g transform="translate(214 262) rotate(-14)"><rect x="-6" y="-30" width="62" height="64" rx="6" fill="#F4E6C3" stroke="#8A6A35" stroke-width="4"/><rect x="-12" y="-36" width="74" height="12" rx="6" fill="#E2CC98" stroke="#8A6A35" stroke-width="3"/><path d="M6 -10 H42 M6 4 H42 M6 18 H30" stroke="#8A6A35" stroke-width="3"/></g>`,
    sceptre: `<rect x="228" y="150" width="10" height="200" rx="4" fill="#C9A24A" transform="rotate(10 233 250)"/><circle cx="246" cy="146" r="16" fill="#FFC531" stroke="#9A6A00" stroke-width="4"/>`,
  };
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 400" width="330" height="400">
  <ellipse cx="150" cy="384" rx="86" ry="14" fill="rgba(0,0,0,.25)"/>
  <path d="M70 250 Q150 210 230 250 L246 370 Q150 392 54 370Z" fill="${P.cape}"/>
  <path d="M92 232 Q150 214 208 232 L222 362 Q150 386 78 362Z" fill="${P.coat}" stroke="rgba(0,0,0,.2)" stroke-width="4"/>
  <path d="M150 232 L150 372" stroke="${P.trim}" stroke-width="8"/>
  <path d="M84 236 Q150 262 216 236 Q214 252 150 268 Q86 252 84 236Z" fill="#FAFAF6" stroke="#CFCFCF" stroke-width="3"/>
  <ellipse cx="86" cy="300" rx="20" ry="38" fill="${P.coat}" stroke="rgba(0,0,0,.2)" stroke-width="4" transform="rotate(14 86 300)"/>
  <ellipse cx="214" cy="300" rx="20" ry="38" fill="${P.coat}" stroke="rgba(0,0,0,.2)" stroke-width="4" transform="rotate(-14 214 300)"/>
  <circle cx="82" cy="334" r="15" fill="${skin}"/><circle cx="220" cy="334" r="15" fill="${skin}"/>
  ${props[P.prop]}
  <circle cx="150" cy="166" r="72" fill="${skin}" stroke="rgba(120,70,40,.25)" stroke-width="4"/>
  ${name === 'pope' ? '' : `<path d="M84 154 Q90 104 150 100 Q210 104 216 154 Q200 126 150 124 Q100 126 84 154Z" fill="#4A2D17"/><path d="M112 206 Q150 240 188 206 Q176 222 150 224 Q124 222 112 206Z" fill="#4A2D17"/>`}
  <ellipse cx="124" cy="170" rx="9" ry="12" fill="${ink}"/><ellipse cx="176" cy="170" rx="9" ry="12" fill="${ink}"/>
  <circle cx="127" cy="165" r="3" fill="#fff"/><circle cx="179" cy="165" r="3" fill="#fff"/>
  <ellipse cx="108" cy="194" rx="13" ry="8" fill="#F19C9C" opacity=".6"/><ellipse cx="192" cy="194" rx="13" ry="8" fill="#F19C9C" opacity=".6"/>
  <path d="M138 198 Q150 208 162 198" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round"/>
  ${hats[P.hat]}
</svg>`;
}

/* ---------- satellite globe (WebGL, NASA Blue Marble) ---------- */
const gl = $('#earth').getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false });
let U = {};
function initGL(img) {
  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
  const fs = `precision highp float;
  uniform sampler2D tex; uniform vec2 cen; uniform float r; uniform vec2 c0; uniform float alpha; uniform float H; uniform float dim;
  const float PI = 3.14159265;
  void main(){
    vec2 q = vec2(gl_FragCoord.x - cen.x, gl_FragCoord.y - (H - cen.y)) / r;
    float rho = length(q);
    float edge = 1.0 - smoothstep(1.0 - 1.5 / r, 1.0, rho);
    if (rho > 1.0) { gl_FragColor = vec4(0.); return; }
    float c = asin(min(rho, 1.0));
    float lat0 = c0.y, lon0 = c0.x;
    float lat = asin(clamp(cos(c) * sin(lat0) + (rho > 1e-6 ? q.y * sin(c) * cos(lat0) / rho : 0.0), -1.0, 1.0));
    float lon = lon0 + atan(q.x * sin(c), rho * cos(c) * cos(lat0) - q.y * sin(c) * sin(lat0));
    vec2 uv = vec2(fract(lon / (2.0 * PI) + 0.5), 0.5 - lat / PI);
    vec3 col = texture2D(tex, uv).rgb;
    col = pow(col, vec3(0.92)) * 1.06;
    vec3 n = vec3(q.x, q.y, sqrt(max(0.0, 1.0 - rho * rho)));
    float lit = clamp(dot(n, normalize(vec3(-0.45, 0.5, 0.75))), 0.0, 1.0);
    col *= mix(0.42, 1.12, lit) * (1.0 - dim);
    col = mix(col, vec3(0.55, 0.72, 1.0), pow(rho, 8.0) * 0.55);
    gl_FragColor = vec4(col, edge * alpha);
  }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const P = gl.createProgram(); gl.attachShader(P, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(P, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(P); gl.useProgram(P);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(P, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img); gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  for (const k of ['cen', 'r', 'c0', 'alpha', 'H', 'dim']) U[k] = gl.getUniformLocation(P, k);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
}
const octx = $('#over').getContext('2d'), proj = d3.geoOrthographic().clipAngle(90).precision(.25), opath = d3.geoPath(proj, octx);
function earth(C) {
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U.cen, C.cx, C.cy); gl.uniform1f(U.r, C.r); gl.uniform1f(U.H, H); gl.uniform1f(U.dim, C.dim || 0);
  gl.uniform2f(U.c0, C.lon * RAD, C.lat * RAD); gl.uniform1f(U.alpha, C.alpha ?? 1);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  proj.scale(C.r).translate([C.cx, C.cy]).rotate([-C.lon, -C.lat]);
}
const visible = (ll, C) => d3.geoDistance(ll, [C.lon, C.lat]) < PI / 2 - .02;

/* ---------- stars ---------- */
const bctx = $('#bg').getContext('2d'); let STARS = [];
function stars(t) { bctx.clearRect(0, 0, W, H);
  for (const s of STARS) { const y = (s.y + t * 6 * s.z) % 2000, tw = .55 + .45 * Math.sin(t * 1.7 + s.ph);
    bctx.globalAlpha = .12 + .55 * s.z * tw; bctx.fillStyle = '#F7F5EF'; bctx.beginPath(); bctx.arc(s.x, y, .7 + 1.6 * s.sz * s.z, 0, 6.283); bctx.fill(); }
  bctx.globalAlpha = 1; }

/* ---------- data ---------- */
let SPEC, TIM, LAND, CO = {}, FLAG = {}, CHAR = {};
const SPANISH = ['ARG', 'BOL', 'CHL', 'COL', 'ECU', 'PRY', 'PER', 'URY', 'VEN'], OTHER = ['GUY', 'SUR'];
async function loadData() {
  const [t, land, raw] = await Promise.all(['node_modules/world-atlas/countries-50m.json', 'node_modules/world-atlas/land-50m.json', 'node_modules/world-countries/countries.json'].map((u) => fetch(u).then((r) => r.json())));
  const byN = new Map(raw.map((c) => [c.ccn3, c.cca3]));
  for (const f of topojson.feature(t, t.objects.countries).features) { const c = byN.get(String(f.id).padStart(3, '0')); if (c) CO[c] = f; }
  LAND = topojson.feature(land, land.objects.land);
  /* French Guiana is part of France in the data: take just that piece */
  const fra = CO.FRA.geometry; CO.GUF = { type: 'Feature', geometry: { type: 'MultiPolygon', coordinates: fra.coordinates.filter((p) => { const c = d3.geoCentroid({ type: 'Polygon', coordinates: p }); return c[0] < -40 && c[0] > -60 && c[1] > 0 && c[1] < 10; }) } };
  for (const f of ['es', 'pt', 'br']) { const im = await loadImg(`node_modules/flag-icons/flags/4x3/${f}.svg`), c = document.createElement('canvas'); c.width = 640; c.height = 480; c.getContext('2d').drawImage(im, 0, 0, 640, 480); FLAG[f] = c; }
  for (const n of ['pope', 'king_es', 'king_pt']) CHAR[n] = (await loadImg(`assets/chars/${n}.png`))?.src || 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(chibi(n));
}

/* ---------- drawing on the globe ---------- */
const half = (L, side) => d3.geoCircle().center([L + 90 * side, 0]).radius(90)();       /* side -1: west of the line (Spain), +1: east (Portugal) */
function fillGeo(g, col, a, glow = 0) { if (a <= 0) return; octx.save(); octx.globalAlpha = a; if (glow) { octx.shadowColor = col; octx.shadowBlur = glow; }
  octx.beginPath(); opath(g); octx.fillStyle = col; octx.fill(); octx.restore(); }
function strokeGeo(g, col, a, w) { if (a <= 0) return; octx.save(); octx.globalAlpha = a; octx.beginPath(); opath(g); octx.lineJoin = 'round'; octx.lineWidth = w; octx.strokeStyle = col; octx.stroke(); octx.restore(); }
function meridian(L, p, a) {                                       /* the line, drawn from north to south as p goes 0 → 1 */
  if (a <= 0 || p <= 0) return; const lat1 = lerp(82, -80, p), pts = []; for (let la = 82; la >= lat1; la -= 1) pts.push([L, la]); pts.push([L, lat1]);
  const g = { type: 'LineString', coordinates: pts };
  octx.save(); octx.globalAlpha = a; octx.lineCap = 'round'; octx.shadowColor = '#FFE08A'; octx.shadowBlur = 26;
  octx.beginPath(); opath(g); octx.lineWidth = 12; octx.strokeStyle = '#fff'; octx.stroke(); octx.shadowBlur = 0;
  octx.setLineDash([26, 18]); octx.beginPath(); opath(g); octx.lineWidth = 5; octx.strokeStyle = '#12133A'; octx.stroke(); octx.restore();
  const tip = proj([L, lat1]); if (tip && p < 1) { octx.fillStyle = '#FFB020'; octx.beginPath(); octx.arc(tip[0], tip[1], 14, 0, 6.283); octx.fill(); }
}
function label(text, ll, C, size, a, color = '#fff', rot = -4) {
  if (a <= 0 || !visible(ll, C)) return; const p = proj(ll);
  octx.save(); octx.globalAlpha = a; octx.translate(p[0], p[1]); octx.rotate(rot * RAD); octx.font = `800 ${size}px 'Baloo 2'`; octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.lineJoin = 'round'; octx.lineWidth = size * .2; octx.strokeStyle = '#12133A'; octx.strokeText(text, 0, 0); octx.fillStyle = color; octx.fillText(text, 0, 0); octx.restore();
}
/* a ship sailing a route of [lon, lat] waypoints; p = 0..1 along it */
function routeAt(route, p) {
  const segs = route.slice(1).map((b, i) => ({ a: route[i], b, d: d3.geoDistance(route[i], b) })), tot = segs.reduce((s, x) => s + x.d, 0);
  let k = p * tot; for (const s of segs) { if (k <= s.d) return d3.geoInterpolate(s.a, s.b)(k / s.d); k -= s.d; } return route[route.length - 1];
}
function sail(route, p, C, flag, a, scale = 1) {
  if (a <= 0 || p <= 0) return; const N = 80, pts = []; for (let i = 0; i <= N; i++) pts.push(routeAt(route, p * i / N));
  octx.save(); octx.globalAlpha = a * .95; octx.setLineDash([16, 14]); octx.lineWidth = 6; octx.lineCap = 'round'; octx.strokeStyle = '#fff'; octx.shadowColor = 'rgba(0,0,0,.6)'; octx.shadowBlur = 6;
  octx.beginPath(); opath({ type: 'LineString', coordinates: pts }); octx.stroke(); octx.restore();
  const head = pts[pts.length - 1], prev = pts[Math.max(0, pts.length - 4)]; if (!visible(head, C)) return;
  const [x, y] = proj(head), [px, py] = proj(prev) || [x - 1, y], dir = x >= px ? 1 : -1, bob = Math.sin(performance.now ? 0 : 0) * 0;
  octx.save(); octx.globalAlpha = a; octx.translate(x, y - 6); octx.scale(dir * scale, scale);
  octx.fillStyle = 'rgba(0,0,0,.3)'; octx.beginPath(); octx.ellipse(0, 30, 52, 10, 0, 0, 6.283); octx.fill();
  octx.fillStyle = '#7A4A26'; octx.strokeStyle = '#3E2410'; octx.lineWidth = 4; octx.beginPath(); octx.moveTo(-50, 4); octx.lineTo(54, 4); octx.lineTo(38, 30); octx.lineTo(-38, 30); octx.closePath(); octx.fill(); octx.stroke();
  octx.strokeStyle = '#3E2410'; octx.lineWidth = 5; octx.beginPath(); octx.moveTo(0, 4); octx.lineTo(0, -66); octx.stroke();
  octx.fillStyle = '#FAF6EA'; octx.strokeStyle = '#B8AE93'; octx.lineWidth = 3; octx.beginPath(); octx.moveTo(-34, -56); octx.quadraticCurveTo(-4, -34, -34, -8); octx.lineTo(30, -8); octx.quadraticCurveTo(48, -34, 30, -56); octx.closePath(); octx.fill(); octx.stroke();
  octx.strokeStyle = '#C8102E'; octx.lineWidth = 7; octx.beginPath(); octx.moveTo(-2, -48); octx.lineTo(-2, -16); octx.moveTo(-16, -32); octx.lineTo(12, -32); octx.stroke();
  if (FLAG[flag]) octx.drawImage(FLAG[flag], 0, -92, 36, 26);
  octx.restore();
}

/* ---------- timeline ---------- */
const UI = $('#ui');
let LINES, DUR, CAPS = [], KF = [], T = {}, els = {};
const L = (scene) => LINES.find((l) => l.scene === scene);
const wordT = (l, re) => (l.words.find((w) => re.test(w.w)) || l.words[0]).t0;
const ROUTES = {
  columbus: [[-6.95, 37.2], [-15.5, 28.1], [-45, 25], [-74.5, 24.1]],                 /* Palos → Canaries → the Bahamas, 1492 */
  africa: [[-9.1, 38.7], [-17.5, 14.7], [-12, 2], [9, -8], [18.4, -34.4]],             /* Portuguese voyages down Africa to the Cape */
  cabral: [[-9.1, 38.7], [-15.5, 28.1], [-23.5, 15.0], [-30, 0], [-36, -12], [-39.1, -16.4]],   /* Lisbon → Cape Verde → Brazil, 1500 */
};
function buildTimeline() {
  LINES = TIM.lines; DUR = TIM.dur + 2.2;
  for (const s of ['hook', 'race', 'pope', 'push', 'unknown', 'cabral', 'why', 'grew', 'ignored', 'today', 'outro']) T[s] = L(s);
  const v = (lon, lat, r, cy = 900) => ({ lon, lat, r, cy });
  KF = [[0, v(-10, 20, 380, 880)], [T.hook.t1, v(-30, 15, 470, 900)],
    [T.race.t0, v(-30, 18, 470, 900)], [T.race.t0 + 1.2, v(-28, 22, 640, 960)],

function camAt(t) {

function put(el, xy, ax = .5, ay = .5) { el.style.left = (xy[0] - el.offsetWidth * ax) + 'px'; el.style.top = (xy[1] - el.offsetHeight * ay) + 'px'; }

let YEARS = [];

/* ---------- per frame ---------- */
function seek(t) {

  const C = camAt(t), ou = t - outro.t0;
  C.dim = .25 * prog(t, ignored.t0 + .2, ignored.t0 + .8) * (1 - prog(t, today.t0 + 1.2, today.t0 + 2)) + .45 * prog(t, today.t0 + .6, today.t0 + 1.2) * (1 - prog(ou, 0, .5)) + .5 * prog(ou, .4, 1.2);
  earth(C); octx.clearRect(0, 0, W, H);

  const hookL = Lt, inHook = t < race.t0, Lnow = inHook ? hookL : t < push.t0 ? Lp : lerp(Lp, Lt, slide);
  const lineDraw = inHook ? E.inout(prog(t, .7, 2.0)) : E.inout(prog(t, wordT(pope, /line/) - .1, wordT(pope, /line/) + 1.2));

    fillGeo(CO.BRA, '#2FBF71', .85 * lang, 28); strokeGeo(CO.BRA, '#fff', lang, 3); }

  const bp = proj([-58, -8]); const bl = E.settle(prog(t, grew.t0 + .5, grew.t0 + 1.0)) * (1 - prog(t, ignored.t0, ignored.t0 + .4));
